# SwiftLint Configuration for calo

# Disabled Rules
disabled_rules:
  - trailing_whitespace  # Allow trailing whitespace in comments
  - todo  # Allow TODO comments during development

# Opt-in Rules
opt_in_rules:
  - empty_count
  - explicit_init
  - closure_spacing
  - operator_usage_whitespace
  - sorted_imports
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

# Rule Configurations
line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 500

function_body_length:
  warning: 50
  error: 75

type_body_length:
  warning: 300
  error: 400

cyclomatic_complexity:
  warning: 10
  error: 20

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 50
  excluded:
    - id
    - URL
    - url
    - db
    - kg
    - g
    - ml

# Excluded Paths
excluded:
  - Pods
  - DerivedData
  - .build
  - vendor

# Included Paths  
included:
  - Calo

# Custom Rules
custom_rules:
  no_hardcoded_strings:
    name: "No Hardcoded Strings in UI"
    regex: 'Text\("(?!measure\.|meal\.).*"\)'
    match_kinds:
      - string
    message: "Consider using NSLocalizedString for UI strings"
    severity: warning
